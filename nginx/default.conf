# FlexJobs Nginx Server Configuration
# This file goes in /etc/nginx/conf.d/default.conf

# Upstream backend servers (Node.js application)
upstream flexjobs_backend {
    server flexjobs-app:3003 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# FlexJobs server for port 8080 (since port 80 is used by another app)
server {
    listen 8080;
    listen [::]:8080;
    server_name flexjobseu.com www.flexjobseu.com _;
    
    # Let's Encrypt ACME challenge (for future SSL setup)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    
    # Proxy to Node.js application
    location / {
        proxy_pass http://flexjobs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
